name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v0.1.0"
          else
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved next release tag: ${NEXT_TAG}"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore, Build, and Test
        run: |
          dotnet restore TaxOpus.slnx
          dotnet build TaxOpus.slnx --no-restore --configuration Release
          dotnet test TaxOpus.slnx --no-build --configuration Release

      - name: Publish CLI
        run: |
          dotnet publish src/TaxOpus.Cli/TaxOpus.Cli.csproj \
            --configuration Release \
            --no-restore \
            --output publish/taxopus-cli

      - name: Package Release Artifacts
        run: |
          mkdir -p dist
          tar -czf "dist/taxopus-cli-${{ steps.version.outputs.tag }}.tar.gz" -C publish taxopus-cli
          if [ -f data/exports/us_sales_tax_combined.json ] && [ -f data/exports/us_sales_tax_combined.csv ]; then
            cp data/exports/us_sales_tax_combined.json dist/
            cp data/exports/us_sales_tax_combined.csv dist/
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
